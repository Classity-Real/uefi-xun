name: Build xunPkg

# Manual only, by design: this is an unverified, in-progress platform
# package (see Platforms/Xiaomi/xunPkg/PORTING.md). It is not meant to
# fire automatically on every push while the open risks there are
# unresolved.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build type"
        required: true
        default: "DEBUG"
        type: choice
        options:
          - DEBUG
          - RELEASE
      tb128fu_ref:
        description: "xVanTuring/uefi-tb128fu ref to overlay onto (branch, tag or commit)"
        required: true
        default: "tb128fu"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this overlay (xunPkg)
        uses: actions/checkout@v4
        with:
          path: uefi-xun

      - name: Check out uefi-tb128fu (base Mu-Silicium tree)
        uses: actions/checkout@v4
        with:
          repository: xVanTuring/uefi-tb128fu
          ref: ${{ inputs.tb128fu_ref }}
          submodules: false
          path: uefi-tb128fu

      - name: Fetch required submodules of uefi-tb128fu
        working-directory: uefi-tb128fu
        run: |
          git submodule update --init --depth 1 -- \
            Binaries \
            Common/Mu \
            Common/Mu_OEM_Sample \
            Mu_Basecore \
            Silicium-ACPI \
            Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl

      - name: Overlay xunPkg onto the base tree
        run: |
          set -eux
          mkdir -p uefi-tb128fu/Platforms/Xiaomi
          cp -r uefi-xun/Platforms/Xiaomi/xunPkg uefi-tb128fu/Platforms/Xiaomi/xunPkg
          cp uefi-xun/Resources/Configs/xun.toml uefi-tb128fu/Resources/Configs/xun.toml
          if [ -f uefi-xun/Resources/DTBs/xun.dtb ]; then
            cp uefi-xun/Resources/DTBs/xun.dtb uefi-tb128fu/Resources/DTBs/xun.dtb
            echo "xun.dtb present – good"
          else
            echo "::warning::Resources/DTBs/xun.dtb is missing"
          fi

      - name: Install build dependencies + force system nasm
        working-directory: uefi-tb128fu
        env:
          CI_BUILD: "true"
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm python3-pip
          ./setup_env.sh --package-manager apt || true

          # Stronger bypass for the broken mu_nasm NuGet
          mkdir -p $HOME/.nuget/packages/mu_nasm/20016.1.1
          touch $HOME/.nuget/packages/mu_nasm/20016.1.1/mu_nasm.nuspec
          echo "Fake mu_nasm package to satisfy SDE" > $HOME/.nuget/packages/mu_nasm/20016.1.1/README.md

          # Force system nasm for the whole job
          export NASM_PREFIX=/usr/bin/
          echo "NASM_PREFIX=/usr/bin/" >> $GITHUB_ENV
          which nasm
          nasm -v

      - name: Build xun firmware
        working-directory: uefi-tb128fu
        env:
          NASM_PREFIX: /usr/bin/
        run: |
          export NASM_PREFIX=/usr/bin/
          ./build_uefi.py -d xun -r ${{ inputs.build_mode }}

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xun-uefi-${{ inputs.build_mode }}
          path: |
            uefi-tb128fu/Build/xunPkg/**/FV/SILICIUM_UEFI.fd
            uefi-tb128fu/Build/xunPkg/**/*.log
          if-no-files-found: warn
